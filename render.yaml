services:
  - type: web
    name: dj-carl-events
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
    disk:
      name: dj-carl-data
      mountPath: /var/data
      sizeGB: 1
