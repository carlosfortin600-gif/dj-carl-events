# Ping Render toutes les 10 min pour limiter la mise en veille (gratuit).
# Pour un serveur vraiment toujours actif : Render → Instance → Standard (payant).
name: Render keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check dj-carl-events
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 "https://dj-carl-events.onrender.com/api/health"
