<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Buzzer — Master (v9.3 + TimerE)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}
    .grid{display:grid;grid-template-columns:1fr 1fr;height:100%}
    .side{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .left{background:linear-gradient(180deg,#ff0000,#b00000)}
    .right{background:linear-gradient(180deg,#0055ff,#0022aa)}
    .scoreCenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:1000;
      font-size:clamp(64px,18vw,220px);line-height:.9;text-align:center}
    .controlsWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:12vh;display:flex;
      gap:12px;flex-direction:column;align-items:center}
    .controlsRow{display:flex;gap:22px}
    .btn{padding:10px 14px;border-radius:9999px;background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:800;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
    .btn:hover{transform:translateY(-1px);box-shadow:0 0 12px rgba(0,0,0,.4)}
    a.btn{text-decoration:none;color:#fff;display:inline-block;text-align:center}
    a.btn.homeLink{background:rgba(0,212,255,.15);border-color:rgba(0,212,255,.45)}
    .btn.toggled{background:rgba(0,255,160,.25);border-color:rgba(0,255,160,.9)}
    .btnTimerBig{
      font-size:16px;
      padding:12px 22px;
      border-radius:9999px;
      box-shadow:0 0 16px rgba(0,0,0,.45);
    }
    .btnTimerBig.toggled{
      background:linear-gradient(135deg,rgba(0,255,160,.4),rgba(0,190,140,.7));
      border-color:rgba(0,255,160,1);
    }
    .kbd{display:inline-block;padding:2px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.4);
      background:rgba(255,255,255,.1);font-weight:700}
    .topBar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
      z-index:6;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);
      flex-wrap:wrap}
    .label{font-weight:900;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
      background:rgba(255,255,255,.1)}
    .sel{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);
      border-radius:8px;padding:6px 8px}
    .badge{padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
      background:rgba(255,255,255,.12);font-weight:700}
    .ok{border-color:rgba(0,255,160,.7);background:rgba(0,255,160,.12)}
    .warn{border-color:rgba(255,200,0,.7)}
    .amb{background:rgba(0,255,160,.22);border-color:rgba(0,255,160,.65)}
    .amb.active{background:rgba(0,255,160,.32);border-color:rgba(0,255,160,.85)}
    .strobe{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
    @keyframes strobe{0%{opacity:0}10%{opacity:1}20%{opacity:.3}35%{opacity:.9}55%{opacity:.25}75%{opacity:.8}100%{opacity:0}}
    .strobeOn{animation:strobe 2s ease-out}
    .selected{outline:8px solid rgba(255,255,255,.85);outline-offset:-8px;filter:brightness(1.1) saturate(1.1)}
    .final{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
      z-index:5;opacity:0;transition:opacity .5s ease;pointer-events:none}
    .final.visible{opacity:1;pointer-events:auto}
    .final.red{background:#c00000}
    .final.blue{background:#0850ff}
    .finalText{font-size:clamp(56px,12vw,220px);font-weight:1000;text-transform:uppercase;text-align:center}
    .sub{margin-top:10px;font-size:clamp(24px,3.5vw,56px);font-weight:900}
    .tieBg{position:fixed;inset:0;z-index:3;display:none;transition:background .35s ease}
    .tieBg.visible{display:block}
    .tieBg.red{background:#c00000}
    .tieBg.blue{background:#0850ff}
    .bubble{position:absolute;left:50%;bottom:12vh;font-weight:900;padding:6px 10px;border-radius:999px;
      background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);will-change:transform,opacity}
    .bubble.plus{color:#80ff80}.bubble.minus{color:#ff8080}
    @keyframes floatUp{from{opacity:0;transform:translate(-50%,0) scale(.9)}20%{opacity:1}
      to{opacity:0;transform:translate(-50%,-120px) scale(1.05)}}
    .bubbleAnim{animation:floatUp .9s ease-out forwards}
    .footer{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:12px;
      align-items:center;z-index:4;flex-wrap:wrap;justify-content:center}

    .timerOverlay{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      z-index:4;
    }
    .timerBox{
      background:rgba(0,0,0,.55);
      padding:12px 28px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.35);
      box-shadow:0 0 40px rgba(0,0,0,.8);
    }
    .timerText{
      font-size:clamp(64px,18vw,200px);
      font-weight:1000;
      letter-spacing:.03em;
      text-align:center;
      text-shadow:0 0 30px rgba(255,255,255,.6);
    }
  
    .btnTimerBig{
      font-size:20px;
      padding:16px 30px;
      border-radius:9999px;
      box-shadow:0 0 22px rgba(0,0,0,.7);
    }
    .timerFloat{
      position:absolute;
      top:8px;
      left:8px;
      z-index:8;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .wheelOverlay{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:7;
      background:rgba(0,0,0,.85);
    }
    .wheelOverlay.visible{
      display:flex;
    }
    .wheelFrame{
      width:min(960px,90vw);
      height:min(540px,80vh);
      border-radius:24px;
      border:4px solid rgba(255,255,255,.5);
      box-shadow:0 0 40px rgba(0,0,0,.9);
      background:#000;
    }

  </style>
</head>
<body>
  <audio id="cheerAudio" preload="auto" src="Applaudissements, ovation de la foule pour toi. 👏Tu le mérites. Tu as réussi! Bravo!🙏💖🌹.mp3"></audio>
  <audio id="buzzAudio"  preload="auto" src="Son Buzzer perdant.mp3"></audio>
  <audio id="dingAudio"  preload="auto" src="Ding - Sound Effect.mp3"></audio>

  <div class="timerFloat">
  <a
    href="/"
    class="btn btnTimerBig homeLink"
    data-home-confirm
    data-home-confirm-message="Retourner à l'accueil ?&#10;&#10;Vous quittez la console Quiz la ta chanson. L'écran jeu n'est pas remis à zéro."
  >🏠 Accueil</a>
  <button id="btnTimer" class="btn btnTimerBig">⏱️ Timer</button>
  <button id="btnWheel" class="btn btnTimerBig">🎡 Roue</button>
  <button id="btnViewer" class="btn btnTimerBig" type="button">🎥 Viewer</button>
</div>
  <div class="topBar">
    <span class="label">🎛 Tableau Maître v9.3 + TimerE</span>
    <span id="midiStatus" class="badge warn">MIDI: non connecté</span>
    <span id="midiHint" class="badge warn" hidden></span>
    <label>Sortie:</label>
    <select id="midiOut" class="sel"></select>
    <button id="reqMidi" class="btn">Autoriser le MIDI</button>
    <button id="btnAmb" class="btn amb">Ambiance du jeu</button>
  </div>

  <div class="grid" id="gameGrid">
    <div class="side left" id="leftSide">
      <div class="strobe" id="strobeLeft"></div>
      <div class="scoreCenter" id="lScore">0</div>
      <div class="controlsWrap">
        <div class="controlsRow">
          <button class="btn" id="lMinus">−</button>
          <button class="btn" id="lPlus">+</button>
        </div>
      </div>
    </div>
    <div class="side right" id="rightSide">
      <div class="strobe" id="strobeRight"></div>
      <div class="scoreCenter" id="rScore">0</div>
      <div class="controlsWrap">
        <div class="controlsRow">
          <button class="btn" id="rMinus">−</button>
          <button class="btn" id="rPlus">+</button>
        </div>
      </div>
    </div>

    <div class="timerOverlay" id="timerOverlay">
      <div class="timerBox">
        <div class="timerText" id="timerText">00:00.0</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="kbd">←</span>/<span class="kbd">1</span> = Buzzer Rouge ·
    <span class="kbd">→</span>/<span class="kbd">2</span> = Buzzer Bleu ·
    <span class="kbd">Q/W</span> = −/+ gauche ·
    <span class="kbd">A/S</span> = −/+ droite ·
    <span class="kbd">Num 7/8</span> = −/+ gauche ·
    <span class="kbd">Num 4/5</span> = −/+ droite ·
    <span class="kbd">F ou Num −</span> = Finale ·
    <span class="kbd">0</span> = Reset ·
    <span class="kbd">Timer</span> + <span class="kbd">Espace</span> = start/stop ·
    <span class="kbd">T</span> = Reset timer
  </div>

  <div class="wheelOverlay" id="wheelOverlay">
    <iframe
      id="wheelFrame"
      class="wheelFrame"
      src="/quiz-la-ta-chanson/roue-principal.html"
      loading="lazy"
    ></iframe>
  </div>

  <div class="tieBg" id="tieBg"></div>
  <div class="final" id="finalOverlay">
    <div class="finalText" id="finalTitle">GAGNANT</div>
    <div class="sub" id="finalSub"></div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  const chan=new BroadcastChannel('buzzerGame');

  const cheer=document.getElementById('cheerAudio');
  const buzz=document.getElementById('buzzAudio');
  const ding=document.getElementById('dingAudio');
  const DING_VOL_SCORE = 0.32;
  const DING_VOL_BLUE = 1;
  const BUZZ_VOL_RED = 0.28;
  let showMaster = 1;
  function playAt(audio, base) {
    if (!(showMaster > 0)) return;
    try {
      audio.volume = Math.min(1, base * showMaster);
      audio.currentTime = 0;
      audio.play();
    } catch (e) {}
  }
  try{ ding.volume = DING_VOL_SCORE; }catch(e){}
  try{ buzz.volume = BUZZ_VOL_RED; }catch(e){}

  const left=document.getElementById('leftSide');
  const right=document.getElementById('rightSide');
  const strobeL=document.getElementById('strobeLeft');
  const strobeR=document.getElementById('strobeRight');
  const lScoreEl=document.getElementById('lScore');
  const rScoreEl=document.getElementById('rScore');
  const finalOverlay=document.getElementById('finalOverlay');
  const finalTitle=document.getElementById('finalTitle');
  const finalSub=document.getElementById('finalSub');
  const tieBg=document.getElementById('tieBg');
  const btnAmb=document.getElementById('btnAmb');

  const btnTimer=document.getElementById('btnTimer');
  const btnWheel=document.getElementById('btnWheel');
  const timerOverlay=document.getElementById('timerOverlay');
  const timerText=document.getElementById('timerText');
  const wheelOverlay=document.getElementById('wheelOverlay');

  let lScore=0,rScore=0,selected='',lockUntil=0;

  // MIDI
  let midiAccess=null,midiOut=null;
  const midiStatus=document.getElementById('midiStatus');
  const midiHint=document.getElementById('midiHint');
  const midiOutSel=document.getElementById('midiOut');
  const reqMidiBtn=document.getElementById('reqMidi');
  const CH=1, NOTE_RED=60, NOTE_BLUE=62, NOTE_AMB=64;
  const MIDI_OUT_KEY='djCarlQuizMidiOutId';
  let tieInterval=null;

  function localhostMidiUrl(){
    const port=location.port || '3000';
    return 'http://127.0.0.1:'+port+location.pathname+location.search;
  }

  function showMidiHint(text){
    if(!text){
      midiHint.hidden=true;
      midiHint.textContent='';
      return;
    }
    midiHint.hidden=false;
    midiHint.textContent=text;
  }

  function updateMidiUI(){
    const ok=!!midiOut;
    midiStatus.textContent = ok ? 'MIDI: connecté' : 'MIDI: non connecté';
    midiStatus.className = 'badge ' + (ok ? 'ok' : 'warn');
  }

  function populateOutputs(){
    midiOutSel.innerHTML='';
    if(!midiAccess) return;
    const outputs=[...midiAccess.outputs.values()];
    outputs.forEach(p=>{
      const o=document.createElement('option');
      o.value=p.id;
      o.textContent=p.name+' ('+p.manufacturer+')';
      midiOutSel.appendChild(o);
    });
    if(!outputs.length){
      midiOut=null;
      showMidiHint('Aucune sortie MIDI — branchez l’interface USB.');
      updateMidiUI();
      return;
    }
    showMidiHint('');
    const saved=localStorage.getItem(MIDI_OUT_KEY);
    const pick=outputs.find(p=>p.id===saved) || outputs[0];
    midiOut=pick;
    midiOutSel.value=pick.id;
    updateMidiUI();
  }

  function onMidiStateChange(){
    populateOutputs();
  }

  async function connectMidi(){
    if(typeof navigator.requestMIDIAccess!=='function'){
      alert('Ce navigateur ne supporte pas le MIDI Web. Utilise Chrome ou Edge sur l’ordinateur qui envoie le DMX.');
      return;
    }
    if(!window.isSecureContext){
      const url=localhostMidiUrl();
      const go=confirm(
        'Le MIDI ne fonctionne pas en http:// sur l’adresse Wi‑Fi (192.168…).\n\n'+
        'Ouvre la console maître en local :\n'+url+'\n\n'+
        'Clique OK pour y aller maintenant (viewer et téléphones restent sur le Wi‑Fi).'
      );
      if(go) location.href=url;
      return;
    }
    reqMidiBtn.disabled=true;
    try{
      midiAccess = await navigator.requestMIDIAccess({ sysex:false });
      midiAccess.onstatechange=onMidiStateChange;
      populateOutputs();
    }catch(e){
      const name=e && e.name ? e.name : '';
      if(name==='NotAllowedError' || name==='SecurityError'){
        alert(
          'Accès MIDI refusé.\n\n'+
          '• Clique « Autoriser » dans la fenêtre Chrome.\n'+
          '• Ou : icône cadenas → Paramètres du site → MIDI → Autoriser.\n'+
          '• Utilise http://127.0.0.1:'+(location.port||'3000')+' (pas l’IP Wi‑Fi) pour la console maître.'
        );
      }else{
        alert('MIDI indisponible : '+(e && e.message ? e.message : String(e)));
      }
    }finally{
      reqMidiBtn.disabled=false;
    }
  }

  midiOutSel.addEventListener('change',()=>{
    if(!midiAccess) return;
    midiOut=[...midiAccess.outputs.values()].find(p=>p.id===midiOutSel.value)||null;
    if(midiOut) try{ localStorage.setItem(MIDI_OUT_KEY, midiOut.id); }catch(err){}
    updateMidiUI();
  });
  reqMidiBtn.addEventListener('click', connectMidi);

  if(!window.isSecureContext){
    showMidiHint('MIDI : ouvrir en 127.0.0.1');
  }

  function send(status,b1,b2){
    if(!midiOut) return;
    try{ midiOut.send([status,b1,b2]); }catch(e){}}
  function sendNoteOn(ch,n,v=127){
    send(0x90|((ch-1)&0x0F), n&0x7F, v&0x7F);
  }
  function sendNoteOff(ch,n){
    send(0x80|((ch-1)&0x0F), n&0x7F, 0);
  }

  function applyTieBg(onRed){
    tieBg.classList.toggle('red', onRed);
    tieBg.classList.toggle('blue', !onRed);
    chan.postMessage({type:'tieAlt', red:onRed});
  }

  function stopTieAlt(){
    if(tieInterval){ clearInterval(tieInterval); tieInterval=null; }
    tieBg.classList.remove('red','blue');
  }

  function ambience(){
    stopTieAlt();
    sendNoteOff(CH,NOTE_RED);
    sendNoteOff(CH,NOTE_BLUE);
    sendNoteOff(CH,NOTE_AMB);
    setTimeout(()=>{ sendNoteOn(CH,NOTE_AMB); },40);
    btnAmb.classList.add('active');
  }

  function chansonRemoteSnapshot(){
    return {
      lScore,
      rScore,
      selected,
      timerEnabled,
      timerRunning,
      timerText: timerText ? timerText.textContent : "00:00.0",
      wheelEnabled
    };
  }

  let remoteSocket = null;
  function pushChansonRemoteState(){
    if(!remoteSocket || !remoteSocket.connected) return;
    remoteSocket.emit("chansonStatePush", chansonRemoteSnapshot());
  }

  function update(){
    lScoreEl.textContent=lScore;
    rScoreEl.textContent=rScore;
    chan.postMessage({type:'update',lScore,rScore,selected});
    pushChansonRemoteState();
  }
  function clearSel(){
    left.classList.remove('selected');
    right.classList.remove('selected');
  }
  function flash(el){
    el.classList.remove('strobeOn');
    void el.offsetWidth;
    el.classList.add('strobeOn');
  }

  function spawnBubbles(side, delta){
    const host = side==='left'? left : right;
    const magnitude = Math.max(1, Math.min(3, Math.abs(delta)));
    for(let i=0;i<3*magnitude;i++){
      const b=document.createElement('div');
      b.className='bubble bubbleAnim ' + (delta>0?'plus':'minus');
      const jitterX=(Math.random()*80-40);
      const delay=Math.random()*120;
      b.style.transform='translate(calc(-50% + ' + jitterX + 'px), 0)';
      b.style.animationDelay = delay+'ms';
      b.textContent=(delta>0?'+':'−')+Math.abs(delta);
      host.appendChild(b);
      setTimeout(()=>b.remove(), 1200);
    }
  }

  function scoreDelta(side,delta){
    if(side==='left'){ lScore=Math.max(0,lScore+delta); }
    else { rScore=Math.max(0,rScore+delta); }
    playAt(ding, DING_VOL_SCORE);
    spawnBubbles(side, delta);
    update();
    chan.postMessage({type:'bubble',side,delta});
  }

  function selectRed(){
    const now=performance.now();
    if(selected!=='red' && now<lockUntil && selected==='blue') return;
    clearSel();
    selected='red';
    left.classList.add('selected');
    flash(strobeL);
    playAt(buzz, BUZZ_VOL_RED);
    lockUntil=performance.now()+3000;
    stopTieAlt();
    sendNoteOff(CH,NOTE_BLUE);
    sendNoteOff(CH,NOTE_AMB);
    sendNoteOn(CH,NOTE_RED);
    chan.postMessage({type:'select',selected});
  }
  function selectBlue(){
    const now=performance.now();
    if(selected!=='blue' && now<lockUntil && selected==='red') return;
    clearSel();
    selected='blue';
    right.classList.add('selected');
    flash(strobeR);
    playAt(ding, DING_VOL_BLUE);
    lockUntil=performance.now()+3000;
    stopTieAlt();
    sendNoteOff(CH,NOTE_RED);
    sendNoteOff(CH,NOTE_AMB);
    sendNoteOn(CH,NOTE_BLUE);
    chan.postMessage({type:'select',selected});
  }

  function showTie(){
    stopTieAlt();
    finalOverlay.classList.remove('red','blue','visible');
    tieBg.classList.add('visible');
    finalTitle.textContent='ÉGALITÉ';
    finalSub.textContent=lScore+' - '+rScore;
    finalOverlay.classList.add('visible');
    let onRed=true;
    chan.postMessage({type:'tie',lScore,rScore});
    applyTieBg(onRed);
    sendNoteOff(CH,NOTE_BLUE);
    sendNoteOff(CH,NOTE_AMB);
    sendNoteOn(CH,NOTE_RED);
    tieInterval=setInterval(()=>{
      onRed=!onRed;
      applyTieBg(onRed);
      if(onRed){
        sendNoteOff(CH,NOTE_BLUE);
        sendNoteOn(CH,NOTE_RED);
      }else{
        sendNoteOff(CH,NOTE_RED);
        sendNoteOn(CH,NOTE_BLUE);
      }
    },1000);
    playAt(cheer, 1);
  }

  function setFinal(side){
    stopTieAlt();
    finalOverlay.classList.remove('red','blue','visible');
    tieBg.classList.remove('visible');
    let win=0,lose=0;
    if(side==='red'){
      win=lScore; lose=rScore;
      finalOverlay.classList.add('red');
      finalTitle.textContent='GAGNANT';
      finalSub.textContent='Équipe Rouge — '+win+' - '+lose;
      sendNoteOff(CH,NOTE_BLUE);
      sendNoteOff(CH,NOTE_AMB);
      sendNoteOn(CH,NOTE_RED);
      chan.postMessage({type:'final',overlay:'red',lScore,rScore});
    }else{
      win=rScore; lose=lScore;
      finalOverlay.classList.add('blue');
      finalTitle.textContent='GAGNANT';
      finalSub.textContent='Équipe Bleue — '+win+' - '+lose;
      sendNoteOff(CH,NOTE_RED);
      sendNoteOff(CH,NOTE_AMB);
      sendNoteOn(CH,NOTE_BLUE);
      chan.postMessage({type:'final',overlay:'blue',lScore,rScore});
    }
    finalOverlay.classList.add('visible');
    playAt(cheer, 1);
  }

  // TIMER avec setInterval
  let timerEnabled=false;
  let timerRunning=false;
  let timerStartMs=0;
  let timerAccumMs=0;
  let timerId=null;

  function fmt(ms){
    const t=Math.max(0, ms|0);
    const m=Math.floor(t/60000);
    const s=Math.floor((t%60000)/1000);
    const d=Math.floor((t%1000)/100);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d;
  }

  function timerUpdateLoop(){
    if(!timerRunning){
      if(timerId){ clearInterval(timerId); timerId=null; }
      return;
    }
    const now = performance.now();
    const elapsed = timerAccumMs + (now - timerStartMs);
    const text = fmt(elapsed);
    timerText.textContent = text;
    chan.postMessage({type:'timerTick', elapsed, text, running:true});
    pushChansonRemoteState();
  }

  function timerStartStop(){
    if(!timerEnabled) return;
    if(!timerRunning){
      timerRunning = true;
      timerStartMs = performance.now();
      if(!timerId){
        timerId = setInterval(timerUpdateLoop, 100);
      }
    }else{
      const now = performance.now();
      timerAccumMs += (now - timerStartMs);
      timerRunning = false;
      if(timerId){ clearInterval(timerId); timerId=null; }
      const text = fmt(timerAccumMs);
      timerText.textContent = text;
      chan.postMessage({type:'timerTick', elapsed:timerAccumMs, text, running:false});
      pushChansonRemoteState();
    }
  }

  function timerReset(){
    timerRunning=false;
    if(timerId){ clearInterval(timerId); timerId=null; }
    timerStartMs=0;
    timerAccumMs=0;
    timerText.textContent='00:00.0';
    chan.postMessage({type:'timerReset', elapsed:0, text:'00:00.0'});
    pushChansonRemoteState();
  }

  let wheelEnabled=false;
  function setWheelEnabled(on){
    wheelEnabled = on;
    if(btnWheel){
      btnWheel.classList.toggle('toggled', on);
    }
    if(wheelOverlay){
      wheelOverlay.classList.toggle('visible', on);
    }
    chan.postMessage({type:'wheelMode', enabled:on});
    pushChansonRemoteState();
  }

  function setTimerEnabled(on){
    timerEnabled=on;
    btnTimer.classList.toggle('toggled', on);
    timerOverlay.style.display = on ? 'flex' : 'none';
    if(!on){
      timerRunning=false;
      if(timerId){ clearInterval(timerId); timerId=null; }
    }
    chan.postMessage({type:'timerMode', enabled:on});
    pushChansonRemoteState();
  }

  function resetGame(){
    lScore=0; rScore=0;
    update();
    finalOverlay.classList.remove('visible','red','blue');
    tieBg.classList.remove('visible','red','blue');
    clearSel();
    selected=''; lockUntil=0;
    stopTieAlt();
    try{ cheer.pause(); cheer.currentTime=0; }catch(err){}
    sendNoteOff(CH,NOTE_RED);
    sendNoteOff(CH,NOTE_BLUE);
    sendNoteOff(CH,NOTE_AMB);
    timerReset();
    setWheelEnabled(false);
    chan.postMessage({type:'reset'});
  }

  function handleChansonRemote(payload){
    const action = payload && payload.action;
    if(action==='buzz'){
      if(payload.side==='blue') selectBlue();
      else selectRed();
      return;
    }
    if(action==='score'){
      const side = payload.side === 'right' ? 'right' : 'left';
      const delta = Number(payload.delta) > 0 ? 1 : -1;
      scoreDelta(side, delta);
      return;
    }
    if(action==='finale'){
      if(lScore===rScore) showTie();
      else if(lScore>rScore) setFinal('red');
      else setFinal('blue');
      pushChansonRemoteState();
      return;
    }
    if(action==='reset'){
      resetGame();
      return;
    }
    if(action==='timerToggle'){
      setTimerEnabled(!timerEnabled);
      return;
    }
    if(action==='timerStartStop'){
      timerStartStop();
      return;
    }
    if(action==='timerReset'){
      timerReset();
      return;
    }
    if(action==='wheelToggle'){
      setWheelEnabled(!wheelEnabled);
      return;
    }
    if(action==='ambiance'){
      ambience();
      pushChansonRemoteState();
    }
  }

  // Boutons +/-
  document.getElementById('lMinus').onclick=()=>scoreDelta('left',-1);
  document.getElementById('lPlus').onclick =()=>scoreDelta('left',+1);
  document.getElementById('rMinus').onclick=()=>scoreDelta('right',-1);
  document.getElementById('rPlus').onclick =()=>scoreDelta('right',+1);
  btnAmb.onclick=()=>ambience();
  btnTimer.onclick=()=> setTimerEnabled(!timerEnabled);
  btnWheel.onclick=()=> setWheelEnabled(!wheelEnabled);
  document.getElementById('btnViewer')?.addEventListener('click', () => {
    window.open(
      '/quiz-la-ta-chanson/viewer',
      'djCarlQuizChansonViewer',
      'noopener,noreferrer'
    );
  });

  // Clavier
  window.addEventListener('keydown',(e)=>{
    if(e.repeat) return;

    // Timer controls
    if(timerEnabled){
      if(e.code==='Space'){ e.preventDefault(); timerStartStop(); return; }
      if(e.key==='t' || e.key==='T'){ timerReset(); return; }
      // si on pèse 1 ou 2 pendant que le timer est en marche, on l'arrête mais on laisse passer le buzzer
      const isRedKey  = (e.key==='1' || e.code==='Numpad1' || e.code==='ArrowLeft');
      const isBlueKey = (e.key==='2' || e.code==='Numpad2' || e.code==='ArrowRight');
      if(timerRunning && (isRedKey || isBlueKey)){
        timerStartStop(); // stoppe le chrono mais ne bloque pas la suite
      }
    }

    // score
    if(e.code==='Numpad7') scoreDelta('left',-1);
    if(e.code==='Numpad8') scoreDelta('left',+1);
    if(e.code==='Numpad4') scoreDelta('right',-1);
    if(e.code==='Numpad5') scoreDelta('right',+1);
    if(e.key==='q'||e.key==='Q') scoreDelta('left',-1);
    if(e.key==='w'||e.key==='W') scoreDelta('left',+1);
    if(e.key==='a'||e.key==='A') scoreDelta('right',-1);
    if(e.key==='s'||e.key==='S') scoreDelta('right',+1);

    // buzzers (toujours actifs, même si le timer est ON)
    if(e.key==='1' || e.code==='Numpad1' || e.code==='ArrowLeft') selectRed();
    if(e.key==='2' || e.code==='Numpad2' || e.code==='ArrowRight') selectBlue();

    // finale
    if(e.code==='NumpadSubtract' || e.key==='f' || e.key==='F'){
      if(lScore===rScore){ showTie(); }
      else if(lScore>rScore){ setFinal('red'); }
      else{ setFinal('blue'); }
    }

    // reset
    if(e.key==='0' || e.code==='Numpad0'){
      resetGame();
    }
  });

  ['keydown','click','touchstart','pointerdown'].forEach(ev=>{
    window.addEventListener(ev,()=>{
      try{cheer.load();buzz.load();ding.load();}catch(e){}
    },{once:true,passive:true});
  });

  if (typeof io === "function") {
    remoteSocket = io();
    remoteSocket.emit("joinChansonHost");
    remoteSocket.on("showVolume", (payload) => {
      const level = Number(payload && payload.level);
      if (!Number.isFinite(level)) return;
      showMaster = Math.min(1, Math.max(0, level));
    });
    remoteSocket.on("chansonRemote", (payload) => handleChansonRemote(payload || {}));
    remoteSocket.on("chansonRemoteRequestState", () => pushChansonRemoteState());
    remoteSocket.on("connect", () => pushChansonRemoteState());
  }

  update();
})();
</script>
<script src="/home-confirm.js"></script>
</body>
</html>
