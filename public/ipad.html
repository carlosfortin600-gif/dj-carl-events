<body>
<header>
  <div class="tabs">
    <button type="button" id="tab-chanson">Chanson</button>
    <button type="button" id="tab-feud">Famille en or</button>
    <button type="button" id="tab-jep">Jeopardy</button>
    <button type="button" id="tab-chrono">Chrono</button>
  </div>
  <button type="button" id="restart" hidden>Recommencer</button>
  <button type="button" id="full">Plein écran</button>
  <button type="button" id="keyboard-btn" title="Afficher le clavier">Clavier</button>
  <span id="usb-hint" hidden aria-live="polite">USB</span>
</header>
<p id="msg"></p>
<input id="usb-capture" type="text" readonly tabindex="-1" aria-hidden="true" autocomplete="off">
<div id="keyboard-bar" hidden>
  <input id="keyboard-focus" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Saisie clavier">
  <button type="button" id="keyboard-close">Fermer</button>
</div>
<main id="app"></main>
<div id="mise-bar" hidden></div>
<div id="volume-bar" aria-label="Volume du spectacle">
  <label class="vol">Volume <input id="vol" type="range" min="0" max="100" step="5" value="100" aria-label="Volume"></label>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/feud-sounds.js?v=arm1"></script>
<script>
const app = document.getElementById("app");
const msg = document.getElementById("msg");
const vol = document.getElementById("vol");
const socket = io();
let mode = sessionStorage.getItem("ipad-mode") || "feud";
let feud = null;
let jep = null;
let chanson = null;
let busy = false;
let lastTouch = 0;
let misePhase = "";
let miseValues = [];
let miseIndex = 0;
let showLevel = 1;

function storedVolume() {
  const raw = localStorage.getItem("ipad-volume");
  if (raw == null) return localStorage.getItem("ipad-sound") === "0" ? 0 : 1;
  const n = Number(raw);
  return Number.isFinite(n) ? Math.min(1, Math.max(0, n)) : 1;
}

function pushVolume(level) {
  socket.emit("setShowVolume", { level });
  socket.emit("setShowSound", { on: level > 0 });
}

function applyVolume(level, persist) {
  showLevel = level;
  vol.value = String(Math.round(level * 100));
  if (window.FeudSounds && FeudSounds.setVolume) FeudSounds.setVolume(level);
  if (level <= 0) silenceHere();
  if (persist) localStorage.setItem("ipad-volume", String(level));
  pushVolume(level);
}

vol.addEventListener("input", () => {
  applyVolume(Number(vol.value) / 100, true);
});

applyVolume(storedVolume(), false);

function silenceHere() {
  if (window.FeudSounds) FeudSounds.stop();
}

function setMsg(text) {
  msg.textContent = text || "";
  const local = document.getElementById("mise-error");
  if (local) local.textContent = text || "";
}

function send(name, payload) {
  if (busy) return;
  busy = true;
  socket.emit(name, payload || {}, (res) => {
    busy = false;
    if (!res || !res.ok) setMsg((res && res.error) || "Action refusée.");
    else setMsg("");
  });
  setTimeout(() => { busy = false; }, 2500);
}

/** Commande vers l’ordinateur principal — jamais de son sur la tablette. */
function sendRemote(name, payload) {
  if (busy) return;
  busy = true;
  socket.emit(name, payload || {}, (res) => {
    busy = false;
    if (!res || !res.ok) setMsg((res && res.error) || "Action refusée.");
    else setMsg("");
  });
  setTimeout(() => { busy = false; }, 2500);
}

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function requestFull(el) {
  const req = el.requestFullscreen || el.webkitRequestFullScreen || el.webkitRequestFullscreen;
  if (!req) return;
  try {
    const pending = req.call(el);
    if (pending && pending.catch) pending.catch(() => {});
  } catch (error) { /* iPad refuse l’argument ou l’élément */ }
}

function enterFullscreen() {
  if (isFullscreen()) {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
    if (!exit) return;
    try {
      const pending = exit.call(document);
      if (pending && pending.catch) pending.catch(() => {});
    } catch (error) { /* déjà sorti */ }
    return;
  }
  requestFull(document.documentElement);
}

function syncFullscreenButton() {
  document.getElementById("full").hidden = isFullscreen();
}

function h(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function press(node, run) {
  node.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || node.disabled) return;
    const now = Date.now();
    if (event.pointerType === "mouse" && now - lastTouch < 700) return;
    if (event.pointerType === "touch") lastTouch = now;
    if (window.FeudSounds) FeudSounds.unlock();
    run();
    event.preventDefault();
  });
}

const usbCapture = document.getElementById("usb-capture");

function isTypingTarget() {
  const el = document.activeElement;
  if (!el) return false;
  if (el === usbCapture) return false;
  const tag = el.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
}

function focusUsbCapture() {
  if (mode === "chrono") return;
  const bar = document.getElementById("keyboard-bar");
  if (bar && bar.classList.contains("is-open")) return;
  const el = document.activeElement;
  if (el && el !== usbCapture) {
    const tag = el.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  }
  try {
    usbCapture.focus({ preventScroll: true });
  } catch (error) { /* Safari */ }
}

function miseBarOpen() {
  const g = jep;
  return mode === "jeopardy" && g && (g.phase === "wager" || g.phase === "finale-wager");
}

function typeMiseDigit(key) {
  if (!miseBarOpen()) return;
  let cur = miseValues[miseIndex] || "";
  if (key === "C") cur = "";
  else if (key === "←") cur = cur.slice(0, -1);
  else if (/^[0-9]$/.test(key) && cur.length < 6) cur += key;
  miseValues[miseIndex] = cur;
  const readout = document.querySelector("#mise-bar .mise-readout");
  if (readout) readout.textContent = cur || "0";
}

let usbHintTimer = null;
function flashUsbKey(label) {
  const el = document.getElementById("usb-hint");
  if (!el) return;
  el.hidden = false;
  el.textContent = `USB · ${label}`;
  el.classList.remove("is-flash");
  void el.offsetWidth;
  el.classList.add("is-flash");
  clearTimeout(usbHintTimer);
  usbHintTimer = setTimeout(() => { el.hidden = true; }, 1400);
}

/** Nouvelle question : le premier buzzer bloque l'autre jusqu'à la réponse. */
function feudBuzzLocked(team) {
  const face = feud && feud.faceoff;
  if (!face || !face.turn || face.turn === team) return false;
  return feud.phase === "faceoff" && face.a == null && face.b == null;
}

function actFeudFaceoffTeam(team) {
  const g = feud;
  if (!g || mode !== "feud") return false;
  if (g.phase !== "faceoff" || g.faceoff?.a != null || g.faceoff?.b != null) return false;
  if (feudBuzzLocked(team)) return false;
  send("feudFaceoffTurn", { team });
  return true;
}

function actChansonRemote(action, extra) {
  if (mode !== "chanson") return false;
  sendRemote("chansonRemote", { action, ...(extra || {}) });
  return true;
}

function actChansonBuzz(side) {
  return actChansonRemote("buzz", { side });
}

/** Buzz Jeopardy — même logique que le bouton équipe (nom + score). */
function actJeopardyTeamPress(index) {
  const g = jep;
  if (!g || mode !== "jeopardy") return false;
  if (!g.teams[index]) return false;
  const roundOver = g.phase === "board" && g.boardDone;
  const ranking = !!g.rankingOn && !roundOver && g.phase !== "title" && g.phase !== "winner";
  if (roundOver || ranking) return false;
  const openFloor = g.phase === "clue" && g.respondent == null && g.clue && !g.clue.resolved;
  if (openFloor) send("jeopardyBuzz", { index });
  else send("jeopardySetControl", { index });
  return true;
}

function physicalBuzzKeyFromEvent(event) {
  if (event.key === "1" || event.code === "Digit1" || event.code === "Numpad1") return "1";
  if (event.key === "2" || event.code === "Digit2" || event.code === "Numpad2") return "2";
  return "";
}

function handlePhysicalBuzzKey(label) {
  if (miseBarOpen()) {
    typeMiseDigit(label);
    flashUsbKey(label);
    return;
  }
  if (mode === "chrono") return;
  if (mode === "chanson") {
    if (label === "1") actChansonBuzz("red");
    else actChansonBuzz("blue");
  } else if (mode === "feud") {
    if (label === "1") actFeudFaceoffTeam("a");
    else actFeudFaceoffTeam("b");
  } else if (label === "1") actJeopardyTeamPress(0);
  else actJeopardyTeamPress(1);
  flashUsbKey(label);
}

function onPhysicalBuzzKeydown(event) {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.repeat) return;
  if (event.target !== usbCapture && event.target !== keyboardFocus && isTypingTarget()) return;
  const label = physicalBuzzKeyFromEvent(event);
  if (!label) return;
  event.preventDefault();
  if (mode !== "chanson" && window.FeudSounds) FeudSounds.unlock();
  handlePhysicalBuzzKey(label);
  event.stopPropagation();
}

document.getElementById("tab-chanson").addEventListener("click", () => select("chanson"));
document.getElementById("tab-feud").addEventListener("click", () => select("feud"));
document.getElementById("tab-jep").addEventListener("click", () => select("jeopardy"));
document.getElementById("tab-chrono").addEventListener("click", () => select("chrono"));

function select(next) {
  mode = next;
  sessionStorage.setItem("ipad-mode", next);
  document.getElementById("tab-chanson").classList.toggle("is-on", next === "chanson");
  document.getElementById("tab-feud").classList.toggle("is-on", next === "feud");
  document.getElementById("tab-jep").classList.toggle("is-on", next === "jeopardy");
  document.getElementById("tab-chrono").classList.toggle("is-on", next === "chrono");
  document.body.classList.toggle("is-chrono", next === "chrono");
  if (next === "chanson") socket.emit("joinChansonRemote");
  render();
  if (next === "chrono" && document.activeElement === usbCapture) usbCapture.blur();
  else focusUsbCapture();
}

socket.emit("joinFeudHost", (state) => { feud = state; render(); });
socket.emit("joinJeopardyHost", (state) => { jep = state; render(); });
socket.emit("joinChansonRemote");
socket.on("feudHostState", (state) => {
  feud = state;
  if (mode !== "chrono") render();
});
socket.on("jeopardyHostState", (state) => {
  jep = state;
  if (mode !== "chrono") render();
});
socket.on("chansonState", (state) => {
  chanson = state;
  if (mode === "chanson") applyChansonPanel();
});
socket.on("disconnect", () => setMsg("Connexion coupée. Reste sur le même Wi-Fi."));

  press(buzzRed, () => actChansonBuzz("red"));

  press(buzzBlue, () => actChansonBuzz("blue"));

  press(btnTimer, () => actChansonRemote("timerToggle"));
  const btnChrono = h("button", "gold", "Start / Stop");
  btnChrono.id = "chanson-btn-chrono";
  press(btnChrono, () => actChansonRemote("timerStartStop"));

  press(btnWheel, () => actChansonRemote("wheelToggle"));
  const btnAmb = h("button", "gold", "Ambiance");
  press(btnAmb, () => actChansonRemote("ambiance"));
  const btnFinale = h("button", "", "Finale");
  press(btnFinale, () => actChansonRemote("finale"));

    if (window.confirm("Remettre scores et jeu à zéro sur l’ordinateur ?")) actChansonRemote("reset");

function applyChansonPanel() {
  const g = chanson;
  const scoreL = document.getElementById("chanson-score-l");
  const scoreR = document.getElementById("chanson-score-r");
  if (!scoreL || !scoreR) return;
  if (!g) {
    scoreL.querySelector("b").textContent = "0";
    scoreR.querySelector("b").textContent = "0";
    return;
  }
  scoreL.querySelector("b").textContent = String(g.lScore ?? 0);
  scoreR.querySelector("b").textContent = String(g.rScore ?? 0);
  scoreL.classList.toggle("is-on", g.selected === "red");
  scoreR.classList.toggle("is-on", g.selected === "blue");
  const buzzRedBtn = document.querySelector(".chanson-buzzer-red");
  const buzzBlueBtn = document.querySelector(".chanson-buzzer-blue");
  if (buzzRedBtn) buzzRedBtn.classList.toggle("is-on", g.selected === "red");
  if (buzzBlueBtn) buzzBlueBtn.classList.toggle("is-on", g.selected === "blue");
  const timerEl = document.getElementById("chanson-timer");
  if (timerEl) {
    timerEl.hidden = !g.timerEnabled;
    timerEl.textContent = g.timerText || "00:00.0";
  }
  const btnTimer = document.getElementById("chanson-btn-timer");
  if (btnTimer) btnTimer.classList.toggle("gold", !!g.timerEnabled);
  const btnWheel = document.getElementById("chanson-btn-wheel");
  if (btnWheel) btnWheel.classList.toggle("gold", !!g.wheelEnabled);
  const btnChrono = document.getElementById("chanson-btn-chrono");
  if (btnChrono) {
    btnChrono.classList.toggle("is-on", !!g.timerRunning);
    btnChrono.disabled = !g.timerEnabled;
  }
}

function renderChanson() {
  if (!app.querySelector("[data-chanson-root]")) {
    app.replaceChildren(buildChansonPanel());
  }
  applyChansonPanel();
}

function renderChrono() {
  if (app.querySelector(".chrono-frame")) return;
  const frame = document.createElement("iframe");
  frame.className = "chrono-frame";
  frame.src = "/chrono/host?embed=1";
  frame.title = "Chrono";
  app.replaceChildren(frame);
}

function render() {
  document.body.classList.toggle("is-jep", mode === "jeopardy");
  document.body.classList.toggle("is-feud", mode === "feud");
  document.body.classList.toggle("is-chrono", mode === "chrono");
  if (mode !== "chrono") app.replaceChildren();
  if (mode === "chanson") renderChanson();
  else if (mode === "feud") renderFeud();
  else if (mode === "chrono") renderChrono();
  else renderJeopardy();
  renderMise();
  const restart = document.getElementById("restart");
  restart.hidden = mode !== "jeopardy" || !jep || jep.phase === "title";
}

function renderFeud() {
  if (!feud) {
    app.append(h("p", "status", "Connexion à Famille en or…"));
    return;
  }
  const g = feud;
  const fit = h("div", "feud-fit");
  const status = h("p", `status${g.phase === "steal" ? " is-vol" : ""}`, feudStatus(g));
  fit.append(status);
  const playing = feudPlayingTeam(g);
  const thief = feudStealTeam(g);
  const scores = h("div", "scores");
  ["a", "b"].forEach((id) => {
    const card = h("div", `score ${id}${playing === id ? " is-on is-playing" : ""}`);
    card.append(h("span", "", g.teams[id].name));
    card.append(h("b", "", String(g.teams[id].score)));
    if (thief === id) card.append(h("span", "vol-tag", "VOL"));
    scores.append(card);
  });
  fit.append(scores);
  if (g.question) {
    const pot = g.phase === "play" || g.phase === "steal" || g.phase === "result" ? ` · ${g.roundPoints} pts` : "";
    fit.append(h("div", "question", `${g.questionIndex + 1}/${g.questionCount} ${g.question.text}${pot}`));
  }
  if (g.phase === "faceoff" && g.faceoff?.a == null && g.faceoff?.b == null) {
    const turn = g.faceoff?.turn;
    const pick = h("div", "row");
    const one = h("button", `good${turn === "a" ? " is-on" : ""}`, `1 — ${g.teams.a.name}`);
    const two = h("button", `bad${turn === "b" ? " is-on" : ""}`, `2 — ${g.teams.b.name}`);
    one.disabled = feudBuzzLocked("a");
    two.disabled = feudBuzzLocked("b");
    press(one, () => actFeudFaceoffTeam("a"));
    press(two, () => actFeudFaceoffTeam("b"));
    pick.append(one, two);
    fit.append(pick);
  }
  if (g.question && g.phase !== "title" && g.phase !== "done") {
    const list = h("div", "list");
    g.question.answers.forEach((answer, index) => {
      const row = h("button", `answer${answer.revealed ? " is-open" : ""}`);
      row.append(h("span", "", `${index + 1}. ${answer.text}`));
      row.append(h("small", "", String(answer.points)));
      if (!answer.revealed && (g.phase === "play" || g.phase === "steal" || (g.phase === "faceoff" && g.faceoff?.turn))) {
        press(row, () => {
          if (g.phase === "faceoff") send("feudFaceoffPick", { team: g.faceoff.turn, index }, "reveal");
          else send("feudReveal", { index }, "reveal");
        });
      } else row.disabled = true;
      list.append(row);
    });
    fit.append(list);
  }
  fit.append(questionLimitControl(g));
  const dock = h("div", "dock");
  if (g.phase === "title") {
    const start = h("button", "gold", "Lancer la partie");
    press(start, () => send("feudStart"));
    const change = h("button", "", "Changer de partie");
    press(change, () => {
      const pack = g.pack || {};
      const next = pack.nextName || "la suivante";
      if (!window.confirm(`Changer pour la partie « ${next} » ?`)) return;
      send("feudStartNextPack");
    });
    dock.append(start, change);
  } else if (g.phase === "done") {
    const quiet = h("button", "", "Couper l'ovation");
    press(quiet, () => {
      if (window.FeudSounds) FeudSounds.stop();
      send("feudSilence");
    });
    dock.append(quiet, nextPackButton(g), restartMatchButton());
  } else {
    if ((g.phase === "faceoff" && g.faceoff?.turn) || g.phase === "play") {
      const miss = h("button", "bad", "Mauvaise réponse");
      press(miss, () => {
        if (g.phase === "faceoff") send("feudFaceoffMiss", { team: g.faceoff.turn }, "strike");
        else send("feudStrike", {}, "strike");
      });
      dock.append(miss);
    }
    if (g.phase === "play" && g.roundPoints > 0) {
      const bank = h("button", "good", "Donner les points");
      press(bank, () => send("feudBank", {}, "award"));
      dock.append(bank);
    }
    if (g.phase === "steal") {
      const missed = h("button", "bad", "Raté");
      press(missed, () => send("feudStealMiss", {}, "steal-miss"));
      dock.append(missed);
    }
    if (g.strikes > 0 && g.phase === "play") {
      const undo = h("button", "", "Retirer un X");
      press(undo, () => send("feudUndoStrike"));
      dock.append(undo);
    }
    const nextLabel = g.questionIndex >= g.questionCount - 1 ? "Voir le gagnant" : "Question suivante";
    const next = h("button", `gold${g.phase === "result" ? " is-ready" : ""}`, nextLabel);
    press(next, () => send("feudNext", {}, g.questionIndex >= g.questionCount - 1 ? "done" : ""));
    dock.append(next);
    const replay = h("button", "", "Rejouer la question");
    press(replay, () => send("feudReplayRound"));
    dock.append(replay, restartMatchButton());
  }
  fit.append(dock);
  app.append(fit);
}

function questionLimitControl(g) {
  const total = (g.questions || []).length || g.questionCount;
  const wrap = h("div", "limit");
  wrap.append(h("span", "", "Nombre de questions"));
  const row = h("div", "row");
  const minus = h("button", "", "−");
  const plus = h("button", "", "+");
  minus.disabled = g.questionCount <= 1;
  plus.disabled = g.questionCount >= total;
  press(minus, () => send("feudSetQuestionLimit", { count: g.questionCount - 1 }));
  press(plus, () => send("feudSetQuestionLimit", { count: g.questionCount + 1 }));
  row.append(minus, h("div", "limit-value", String(g.questionCount)), plus);
  wrap.append(row);
  return wrap;
}

function feudPlayingTeam(g) {
  if (g.phase === "play") return g.control;
  if (g.phase === "faceoff") return g.faceoff && g.faceoff.turn;
  if (g.phase === "steal") return feudStealTeam(g);
  return null;
}

function feudStealTeam(g) {
  if (g.phase !== "steal" || !g.control) return null;
  return g.control === "a" ? "b" : "a";
}

function nextPackButton(g) {
  const again = h("button", "gold is-ready", "Autre partie");
  press(again, () => {
    const pack = g.pack || {};
    const next = pack.nextName || "la suivante";
    const last = (pack.index || 0) + 1 >= (pack.count || 5);
    const note = last
      ? `Les 5 parties sont faites. Recommencer avec d'autres questions : « ${next} » ?`
      : `Faire une autre partie avec d'autres questions ?\n\n${next}`;
    if (!window.confirm(note)) return;
    if (window.FeudSounds) FeudSounds.stop();
    socket.emit("feudSilence", {}, () => {
      socket.emit("feudStartNextPack", {}, (res) => {
        if (!res || !res.ok) setMsg((res && res.error) || "Action refusée.");
      });
    });
  });
  return again;
}

function restartMatchButton() {
  const again = h("button", "gold", "Recommencer la partie");
  press(again, () => {
    if (!window.confirm("Recommencer la partie ? Les scores repartent à zéro.")) return;
    if (window.FeudSounds) FeudSounds.stop();
    socket.emit("feudSilence", {}, () => {
      socket.emit("feudStart", {}, (res) => {
        if (!res || !res.ok) setMsg((res && res.error) || "Action refusée.");
      });
    });
  });
  return again;
}

function feudStatus(g) {
  if (g.phase === "title") {
    const pack = g.pack;
    const label = pack ? `Partie ${(pack.index || 0) + 1}/${pack.count} · ${pack.name}. ` : "";
    return `${label}Partie de ${g.questionCount} questions.`;
  }
  if (g.phase === "faceoff") {
    const turn = g.faceoff && g.faceoff.turn;
    if (!turn) return "Choisis qui répond en premier.";
    const other = turn === "a" ? "b" : "a";
    const reply = g.faceoff[turn] == null && g.faceoff[other] != null;
    return reply ? `Droit de réplique : ${g.teams[turn].name}` : `${g.teams[turn].name} répond`;
  }
  if (g.phase === "play" && g.control) return `${g.teams[g.control].name} joue · ${g.strikes} X`;
  if (g.phase === "steal") return "VOL";
  if (g.phase === "result" && g.roundWinner) return `${g.teams[g.roundWinner].name} remporte la manche.`;
  if (g.phase === "done") {
    const next = g.pack && g.pack.nextName ? ` Une autre partie : ${g.pack.nextName} ?` : "";
    if (!g.leader) return `Égalité.${next}`;
    return `${g.teams[g.leader].name} gagne la partie.${next}`;
  }
  return "";
}

function renderJeopardy() {
  if (!jep) {
    app.append(h("p", "status", "Connexion à Jeopardy…"));
    return;
  }
  const g = jep;
  app.append(h("p", "status", jepStatus(g)));
  const tally = questionTally(g);
  const roundOver = g.phase === "board" && g.boardDone;
  const ranking = !!g.rankingOn && !roundOver && g.phase !== "title" && g.phase !== "winner";
  const showRank = roundOver || ranking;
  if (tally && !roundOver && (g.phase === "board" || g.phase === "clue" || g.phase === "wager")) {
    app.append(h("p", "qcount", `${tally.left} questions`));
  }
  if (showRank) app.append(h("p", "qcount", "Classement"));
  const teams = h("div", "teams");
  const order = g.teams.map((team, index) => ({ team, index }));
  if (showRank) order.sort((a, b) => b.team.score - a.team.score || a.index - b.index);
  order.forEach(({ team, index }, place) => {
    const card = h("div", `team${team.control || team.answering ? " is-on" : ""}`);
    const actions = h("div", "row");
    const plus = h("button", "good", "+");
    const minus = h("button", "", "−");
    press(plus, () => send("jeopardyAddScore", { index, delta: 100 }));
    press(minus, () => send("jeopardyAddScore", { index, delta: -100 }));
    actions.append(plus, minus);
    if (roundOver) {
      const line = h("div", "who");
      const rank = h("button", "rank", String(place + 1));
      rank.type = "button";
      press(rank, () => send("jeopardySetControl", { index }));
      const name = document.createElement("input");
      name.className = "who-name";
      name.value = team.name;
      name.maxLength = 28;
      name.enterKeyHint = "done";
      name.addEventListener("change", () => send("jeopardySetTeamName", { index, name: name.value }));
      name.addEventListener("keydown", (event) => {
        event.stopPropagation();
        if (event.key === "Enter") name.blur();
      });
      line.append(rank, name, h("b", "", String(team.score)));
      card.append(line, actions);
    } else {
      const info = h("button", "who");
      info.type = "button";
      if (ranking) info.append(h("span", "rank", String(place + 1)));
      info.append(h("strong", "", team.name));
      info.append(h("b", "", String(team.score)));
      press(info, () => actJeopardyTeamPress(index));
      card.append(info, actions);
    }
    teams.append(card);
  });
  app.append(teams);

  if (roundOver) {
    const counts = h("div", "row");
    [2, 3, 4].forEach((count) => {
      const button = h("button", count === g.teamCount ? "gold" : "", `${count} concurrents`);
      press(button, () => send("jeopardySetTeamCount", { count }));
      counts.append(button);
    });
    const zero = h("button", "", "Points à zéro");
    press(zero, () => {
      if (window.confirm("Remettre les points à zéro ?")) send("jeopardyClearScores");
    });
    app.append(counts, zero);
  }

  if (g.phase === "title") {
    const row = h("div", "row");
    [2, 3, 4].forEach((count) => {
      const button = h("button", count === g.teamCount ? "gold" : "", `${count} concurrents`);
      press(button, () => send("jeopardySetTeamCount", { count }));
      row.append(button);
    });
    const start = h("button", "gold", "Lancer la partie");
    press(start, () => send("jeopardyStart"));
    app.append(row, start);
    return;
  }

  if (g.phase === "board" && g.categories && !g.boardDone) {
    const board = h("div", "board");
    g.categories.forEach((category) => board.append(h("div", "cat", category.name)));
    const rows = g.categories[0] ? g.categories[0].cells.length : 0;
    for (let row = 0; row < rows; row += 1) {
      g.categories.forEach((category, col) => {
        const cell = category.cells[row];
        const button = h("button", `cell${cell.used ? " is-used" : ""}`, cell.used ? "" : String(cell.value));
        if (!cell.used) press(button, () => send("jeopardyPick", { col, row }));
        else button.disabled = true;
        board.append(button);
      });
    }
    app.append(board);
  }

  if (g.clue && (g.phase === "clue" || g.phase === "wager")) {
    app.append(h("div", "question", `${g.clue.category} · ${g.clue.daily ? "Daily Double" : g.clue.value}`));
    app.append(h("p", "clue", g.clue.text || ""));
    if (g.clue.answer) app.append(h("p", "answer-line", g.clue.answer));
  }

  const dock = h("div", "dock");
  if (g.phase === "clue") {
    const right = h("button", "good", "Bonne réponse");
    const wrong = h("button", "bad", "Mauvaise réponse");
    const show = h("button", "", "Montrer la réponse");
    const back = h("button", "", "Tableau");
    right.disabled = g.respondent == null || g.phase !== "clue";
    wrong.disabled = right.disabled;
    press(right, () => send("jeopardyCorrect", { index: g.respondent }, "reveal"));
    press(wrong, () => send("jeopardyWrong", { index: g.respondent }, "strike"));
    press(show, () => send("jeopardyReveal"));
    press(back, () => send("jeopardyCloseClue"));
    dock.append(right, wrong, show, back);
  }
  if (g.phase !== "title") {
    const theme = h("button", "gold", g.themeOn ? "Couper le thème" : "Thème");
    press(theme, () => {
      send("jeopardyToggleTheme", { on: !g.themeOn });
    });
    dock.append(theme);
  }
  if (!g.boardDone && (g.phase === "board" || g.phase === "clue" || g.phase === "wager")) {
    const rank = h("button", "gold", g.rankingOn ? "Fermer" : "Classement");
    press(rank, () => send("jeopardyShowRanking", { on: !g.rankingOn }));
    dock.append(rank);
  }
  if (g.phase === "board" && !g.boardDone) {
    const end = h("button", "gold", "Fin de manche");
    press(end, () => {
      if (window.confirm("Terminer la manche et afficher le classement ?")) send("jeopardyEndRound");
    });
    dock.append(end);
  }
  if (g.phase === "board" && g.boardDone) {
    const next = h("button", "gold", g.roundIndex >= 1 ? "Finale" : "Manche suivante");
    press(next, () => send("jeopardyNextRound"));
    dock.append(next);
  }
  if (g.phase === "finale-wager") {
    const show = h("button", "", "Montrer la question finale");
    press(show, () => send("jeopardyShowFinaleClue"));
    dock.append(show);
  }
  if (g.phase === "finale-reveal" || g.phase === "finale-clue") {
    const reveal = h("button", "", "Montrer la réponse");
    press(reveal, () => send("jeopardyReveal"));
    dock.append(reveal);
    g.teams.forEach((team, index) => {
      const yes = h("button", "good", `${team.name} bonne`);
      const no = h("button", "bad", `${team.name} mauvaise`);
      press(yes, () => send("jeopardyFinaleJudge", { index, correct: true }, "reveal"));
      press(no, () => send("jeopardyFinaleJudge", { index, correct: false }, "strike"));
      dock.append(yes, no);
    });
  }
  if (g.phase === "finale-reveal") {
    const win = h("button", "gold", "Voir le gagnant");
    press(win, () => send("jeopardyShowWinner", {}, "done"));
    dock.append(win);
  }
  if (g.phase === "winner") {
    const names = (g.winners || []).map((team) => team.name).join(" et ");
    app.append(h("div", "question", names || "Gagnant"));
    const again = h("button", "gold", "Rejouer");
    press(again, () => send("jeopardyReset"));
    dock.append(again);
  }
  if (dock.childElementCount) app.append(dock);
}

function renderMise() {
  const bar = document.getElementById("mise-bar");
  const g = mode === "jeopardy" ? jep : null;
  const show = g && (g.phase === "wager" || g.phase === "finale-wager");
  document.body.classList.toggle("has-mise", !!show);
  if (!show) {
    misePhase = "";
    bar.replaceChildren();
    bar.hidden = true;
    return;
  }
  if (misePhase !== g.phase) {
    misePhase = g.phase;
    miseValues = g.teams.map(() => "");
    miseIndex = g.phase === "wager" ? 0 : Math.max(0, g.teams.findIndex((team) => team.control));
    if (miseIndex < 0) miseIndex = 0;
  }
  bar.hidden = false;
  bar.replaceChildren();
  const readout = h("p", "mise-readout", "0");
  const paint = () => {
    readout.textContent = miseValues[miseIndex] || "0";
  };
  const typeDigit = (key) => {
    let cur = miseValues[miseIndex] || "";
    if (key === "C") cur = "";
    else if (key === "←") cur = cur.slice(0, -1);
    else if (cur.length < 6) cur += key;
    miseValues[miseIndex] = cur;
    paint();
  };
  if (g.phase === "finale-wager") {
    const who = h("div", "mise-who");
    g.teams.forEach((team, index) => {
      const pick = h("button", index === miseIndex ? "gold" : "", team.name);
      pick.type = "button";
      press(pick, () => {
        miseIndex = index;
        renderMise();
      });
      who.append(pick);
    });
    bar.append(who);
  }
  bar.append(readout);
  const error = h("p", "mise-error", "");
  error.id = "mise-error";
  bar.append(error);
  const ok = h("button", "gold mise-ok", g.phase === "wager" ? "Confirmer la mise" : "Verrouiller les mises");
  ok.type = "button";
  const confirmMise = () => {
    if (confirmMise.lock) return;
    confirmMise.lock = true;
    setTimeout(() => { confirmMise.lock = false; }, 700);
    busy = false;
    if (g.phase === "wager") {
      send("jeopardySetWager", { amount: Number(miseValues[miseIndex] || 0) });
      return;
    }
    send("jeopardyLockFinaleWagers", { wagers: g.teams.map((_, index) => miseValues[index] || "0") });
  };
  press(ok, confirmMise);
  ok.addEventListener("click", confirmMise);
  bar.append(ok);
  const pad = h("div", "pad");
  ["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "←"].forEach((key) => {
    const keyButton = h("button", "", key);
    keyButton.type = "button";
    press(keyButton, () => typeDigit(key));
    pad.append(keyButton);
  });
  bar.append(pad);
  paint();
}

function questionTally(g) {
  let total = 0;
  let left = 0;
  (g.categories || []).forEach((category) => {
    (category.cells || []).forEach((cell) => {
      total += 1;
      if (!cell.used) left += 1;
    });
  });
  return total ? { total, left } : null;
}

function jepStatus(g) {
  if (g.phase === "title") return "Choisis les concurrents, puis lance.";
  if (g.phase === "board") return g.roundName || "Tableau";
  if (g.phase === "clue") return "Question en cours";
  if (g.phase === "wager") return "Daily Double — entre la mise.";
  if (g.phase === "finale-wager") return "Mises de la finale.";
  if (g.phase === "finale-clue") return "Question finale.";
  if (g.phase === "finale-reveal") return "Correction de la finale.";
  if (g.phase === "winner") return "Partie terminée.";
  return "";
}

const keyboardBar = document.getElementById("keyboard-bar");
const keyboardFocus = document.getElementById("keyboard-focus");

function openKeyboardBar() {
  keyboardBar.hidden = false;
  keyboardBar.classList.add("is-open");
  keyboardFocus.value = "";
  if (window.FeudSounds) FeudSounds.unlock();
  requestAnimationFrame(() => {
    keyboardFocus.focus();
    try { keyboardFocus.select(); } catch (error) { /* iOS */ }
  });
}

function closeKeyboardBar() {
  keyboardFocus.blur();
  keyboardBar.classList.remove("is-open");
  keyboardBar.hidden = true;
  focusUsbCapture();
}

document.getElementById("keyboard-btn").addEventListener("click", () => {
  if (keyboardBar.classList.contains("is-open")) closeKeyboardBar();
  else openKeyboardBar();
});
document.getElementById("keyboard-close").addEventListener("click", () => closeKeyboardBar());
keyboardFocus.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    event.preventDefault();
    closeKeyboardBar();
    return;
  }
  onPhysicalBuzzKeydown(event);
});
usbCapture.addEventListener("keydown", onPhysicalBuzzKeydown);
usbCapture.addEventListener("blur", () => {
  if (mode === "chrono") return;
  setTimeout(focusUsbCapture, 0);
});
document.body.addEventListener("pointerdown", () => {
  if (mode === "chrono") return;
  focusUsbCapture();
}, { passive: true });

document.getElementById("full").addEventListener("click", () => enterFullscreen());
document.getElementById("restart").addEventListener("click", () => {
  if (window.confirm("Recommencer la partie ?")) send("jeopardyReset");
});
document.addEventListener("fullscreenchange", syncFullscreenButton);
document.addEventListener("webkitfullscreenchange", syncFullscreenButton);

syncFullscreenButton();
select(mode);
focusUsbCapture();
</script>
