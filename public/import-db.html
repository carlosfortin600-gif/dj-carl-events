<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Import base de données — DJ Carl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 520px;">
    <h1 class="h4 mb-3">Importer vos événements</h1>
    <p class="text-muted small">
      Envoyez le fichier <code>dist/djcarl-upload.db</code> créé sur votre Mac avec
      <code>npm run export-db</code>.
    </p>
    <form id="importForm" class="card p-4">
      <div class="mb-3">
        <label class="form-label" for="secret">Mot de passe d'import</label>
        <input type="password" class="form-control" id="secret" required autocomplete="off">
      </div>
      <div class="mb-3">
        <label class="form-label" for="dbfile">Fichier base de données (.db)</label>
        <input type="file" class="form-control" id="dbfile" accept=".db" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="submitBtn">Importer</button>
    </form>
    <div id="result" class="mt-3"></div>
    <p class="text-muted small mt-4 mb-0">
      Après import, supprimez la variable <code>IMPORT_SECRET</code> sur Render.
    </p>
  </main>
  <script>
    document.getElementById("importForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const result = document.getElementById("result");
      const file = document.getElementById("dbfile").files[0];
      const secret = document.getElementById("secret").value;
      if (!file) return;

      btn.disabled = true;
      btn.textContent = "Import en cours…";
      result.innerHTML = "";

      try {
        const res = await fetch("/admin/import-db", {
          method: "POST",
          headers: {
            "X-Import-Secret": secret,
            "Content-Type": "application/octet-stream"
          },
          body: await file.arrayBuffer()
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || "Import échoué");
        }
        result.innerHTML =
          '<div class="alert alert-success">' +
          (data.events != null ? data.events + " événement(s) importé(s). " : "") +
          "Le site redémarre — rechargez dans 30 secondes.</div>";
      } catch (err) {
        result.innerHTML = '<div class="alert alert-danger">' + err.message + "</div>";
        btn.disabled = false;
        btn.textContent = "Importer";
      }
    });
  </script>
</body>
</html>
