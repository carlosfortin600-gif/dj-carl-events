<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy — Animateur</title>
<link rel="stylesheet" href="/jeopardy.css">
<style>
html, body {
  margin: 0;
  height: 100%;
  background: #070b14;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

button, input { font-family: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.45; }

.host-shell {
  height: 100dvh;
  display: grid;
  grid-template-columns: minmax(340px, 460px) minmax(0, 1fr);
}

#panel {
  overflow: auto;
  padding: 16px 16px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #0c1220;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}

#stage {
  min-height: 0;
  overflow: auto;
}

.host-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}

.host-top h1 {
  margin: 0;
  color: #f6d76b;
  font-size: 28px;
}

.host-top p, .hint, .msg {
  margin: 4px 0 0;
  color: #9fb0c9;
  font-size: 13px;
  line-height: 1.4;
}

.msg { color: #fecaca; min-height: 0; }
.msg:empty { display: none; }

.host-nav { display: flex; gap: 8px; }

.host-nav a, .host-nav button, .mini, .ghost, .primary, .ok, .bad {
  border-radius: 10px;
  font-weight: 800;
  text-decoration: none;
}

.host-nav a, .host-nav button, .ghost, .mini {
  color: #dbe7ff;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 8px 10px;
}

.primary, .ok, .bad {
  border: 0;
  color: #1a1203;
  padding: 10px 12px;
}

.primary { background: #f6d76b; }
.ok { background: #86efac; }
.bad { background: #fca5a5; }
.mini.is-on { background: #f6d76b; color: #1a1203; border-color: transparent; }
.mini.wide { width: 100%; }

.count-row, .action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.team-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.team-card {
  flex: 1 1 120px;
  padding: 10px;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border: 3px solid transparent;
}

.team-card.is-control { border-color: #f6d76b; }

.team-name, .wager-box input, .finale-wagers input {
  width: 100%;
  border: 0;
  border-radius: 8px;
  padding: 8px;
  font-weight: 800;
}

.score-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.score-line strong { font-size: 26px; }

.status { margin: 0; font-weight: 800; line-height: 1.35; }

.secret {
  padding: 12px;
  border-radius: 14px;
  background: rgba(246, 215, 107, 0.08);
  border: 1px solid rgba(246, 215, 107, 0.28);
}

.secret-clue { margin: 8px 0; font-size: 18px; line-height: 1.35; }
.secret-answer { margin: 0; color: #f6d76b; font-size: 20px; font-weight: 900; }

.judge-list { display: flex; flex-direction: column; gap: 8px; }
.judge-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.judge-row span { color: white; font-weight: 800; }
.finale-wagers { display: flex; flex-direction: column; gap: 8px; }
.finale-wagers label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 800; }
.wager-box { display: flex; flex-direction: column; gap: 8px; }

@media (max-width: 860px) {
  .host-shell { grid-template-columns: 1fr; height: auto; }
  #stage { min-height: 70dvh; }
}
</style>
</head>
<body>
<div class="host-shell">
  <aside id="panel"></aside>
  <main id="stage"></main>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/feud-sounds.js"></script>
<script src="/jeopardy-board.js"></script>
<script src="/jeopardy-host.js"></script>
</body>
</html>
