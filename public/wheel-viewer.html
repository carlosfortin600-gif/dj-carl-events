<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roue — Écran public</title>
<link rel="stylesheet" href="/wheel.css">
<style>
@keyframes elegant-shimmer {
  0%, 100% { opacity: 0.92; }
  50% { opacity: 1; }
}

@keyframes ambient-glow {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 0.7; }
}

body.viewer-elegant {
  overflow-x: hidden;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, rgba(212, 175, 55, 0.16), transparent 55%),
    radial-gradient(ellipse 50% 35% at 100% 80%, rgba(146, 64, 14, 0.1), transparent 50%),
    linear-gradient(180deg, #0a0908 0%, #10131c 48%, #080b12 100%);
  color: #f8f4eb;
}

.viewer-ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.55) 100%);
}

.viewer-ambient::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: min(300px, 32vw);
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(212, 175, 55, 0.15) 15%,
    rgba(212, 175, 55, 0.55) 50%,
    rgba(212, 175, 55, 0.15) 85%,
    transparent
  );
}

.viewer-ambient::after {
  content: "";
  position: absolute;
  top: 12%;
  left: 50%;
  width: min(70vw, 720px);
  height: min(70vw, 720px);
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212, 175, 55, 0.07), transparent 68%);
  animation: ambient-glow 8s ease-in-out infinite;
}

.viewer-app {
  position: relative;
  z-index: 1;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px min(300px, 32vw) 24px 16px;
  gap: 22px;
}

.viewer-app .wheel-prize-banner {
  max-width: min(98vmin, 960px);
  padding: 26px 34px;
  margin-bottom: 0;
  border-radius: 4px;
  border: 1px solid rgba(212, 175, 55, 0.45);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%),
    rgba(12, 10, 8, 0.72);
  box-shadow:
    0 24px 48px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.08),
    0 0 0 1px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(12px);
}

.viewer-app .wheel-prize-banner-label {
  font-size: clamp(12px, 1.8vmin, 16px);
  margin-bottom: 12px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(245, 230, 200, 0.75);
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 600;
}

.viewer-app .wheel-prize-banner-value {
  font-size: clamp(34px, 7vmin, 64px);
  font-weight: 900;
  letter-spacing: 0.02em;
  background: linear-gradient(180deg, #fff8e7 0%, #e8c872 42%, #c9a227 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: elegant-shimmer 4s ease-in-out infinite;
  filter: drop-shadow(0 2px 12px rgba(212, 175, 55, 0.25));
}

.viewer-app .wheel-prize-banner-remaining {
  font-size: clamp(16px, 2.6vmin, 24px);
  margin-top: 14px;
  color: rgba(232, 200, 114, 0.9);
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 600;
  letter-spacing: 0.06em;
}

.viewer-stage {
  width: min(98vmin, 960px);
  padding-top: 0;
  overflow: visible;
  flex: 0 0 auto;
  filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
}

body.viewer-elegant .wheel-winners-panel-viewer {
  background: linear-gradient(180deg, rgba(14, 12, 10, 0.97), rgba(8, 11, 18, 0.97));
  border-left: 1px solid rgba(212, 175, 55, 0.35);
  box-shadow: -12px 0 40px rgba(0, 0, 0, 0.35);
}

body.viewer-elegant .wheel-winners-panel-viewer h3 {
  color: #e8c872;
  letter-spacing: 0.22em;
  font-size: 13px;
  text-shadow: none;
}

body.viewer-elegant .wheel-winners-group-title {
  color: rgba(232, 200, 114, 0.85);
}

body.viewer-elegant .wheel-winners-group-current .wheel-winners-group-title {
  color: #d4af37;
}

body.viewer-elegant .wheel-winners-item {
  background: rgba(255, 255, 255, 0.04);
  border-color: rgba(212, 175, 55, 0.18);
  border-radius: 4px;
}

body.viewer-elegant .wheel-winners-rank {
  color: #c9a227;
}

body.viewer-elegant .wheel-winners-prize {
  color: #e8c872;
}

body.viewer-elegant .wheel-brand-logo {
  filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.5));
  opacity: 0.95;
}

body.viewer-elegant .wheel-winner-fullscreen {
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%, rgba(212, 175, 55, 0.12), transparent 60%),
    linear-gradient(180deg, #060504 0%, #0c0a08 50%, #080a10 100%);
}

body.viewer-elegant .wheel-winner-fullscreen-name {
  background: linear-gradient(180deg, #ffffff 0%, #f5e6c8 38%, #d4af37 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 4px 28px rgba(212, 175, 55, 0.35));
}

body.viewer-elegant .wheel-winner-fullscreen-prize {
  color: rgba(245, 230, 200, 0.95);
  letter-spacing: 0.04em;
  text-shadow: 0 2px 20px rgba(212, 175, 55, 0.25);
}

body.viewer-elegant .wheel-sound-unlock {
  border-color: rgba(212, 175, 55, 0.4);
  color: #e8c872;
}

.viewer-footer {
  display: none;
}

.wheel-viewer-fullscreen-hint {
  display: none;
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 40;
  padding: 10px 16px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.72);
  border: 1px solid rgba(212, 175, 55, 0.35);
  color: #e8c872;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  font-weight: 700;
  pointer-events: none;
}

body.wheel-auto-fullscreen .wheel-viewer-fullscreen-hint {
  display: block;
}

body.wheel-auto-fullscreen.is-fullscreen .wheel-viewer-fullscreen-hint,
body.wheel-auto-fullscreen.wheel-embed .wheel-viewer-fullscreen-hint {
  display: none;
}

body.wheel-embed .wheel-sound-unlock {
  display: none;
}
</style>
</head>
<body class="viewer-elegant">

<div class="viewer-ambient" aria-hidden="true"></div>
<p id="fullscreenHint" class="wheel-viewer-fullscreen-hint">Cliquez pour le plein écran</p>

<div class="viewer-app">
  <div class="wheel-prize-banner" id="wheelPrizeBanner" aria-live="polite">
    <p class="wheel-prize-banner-label">Prix en jeu</p>
    <p id="wheelPrizeValue" class="wheel-prize-banner-value">—</p>
    <p id="wheelPrizeRemaining" class="wheel-prize-banner-remaining"></p>
  </div>

  <div class="viewer-stage">
    <div class="wheel-vertical-scene">
      <div class="wheel-big-six">
        <canvas id="wheelCanvas" class="wheel-canvas wheel-canvas-big-six" width="820" height="660" aria-label="Roue de tirage"></canvas>
        <div class="wheel-lights" id="wheelLights" aria-hidden="true" hidden></div>
      </div>
    </div>
  </div>

  <p class="viewer-footer">Contrôlé depuis la page animateur</p>
</div>

<div id="winnerFullscreen" class="wheel-winner-fullscreen" hidden aria-hidden="true">
  <div class="wheel-winner-fullscreen-inner">
    <p id="winnerFullscreenName" class="wheel-winner-fullscreen-name"></p>
    <p id="winnerFullscreenPrize" class="wheel-winner-fullscreen-prize"></p>
  </div>
</div>

<img src="/logo-dj-carl.png" alt="DJ Carl" class="wheel-brand-logo">

<aside class="wheel-winners-panel wheel-winners-panel-viewer">
  <h3>Gagnants</h3>
  <div id="winnersList" class="wheel-winners-body" aria-live="polite"></div>
</aside>

<script src="/socket.io/socket.io.js"></script>
<script src="/wheel-sounds.js"></script>
<script src="/wheel-core.js"></script>
<script src="/wheel-winners.js"></script>
<script src="/wheel-socket.js"></script>
<script>
WheelSounds.setOutputRole("viewer");

const winnersListEl = document.getElementById("winnersList");
const wheelPrizeValue = document.getElementById("wheelPrizeValue");
const wheelPrizeRemaining = document.getElementById("wheelPrizeRemaining");
const wheelPrizeBanner = document.getElementById("wheelPrizeBanner");
const winnerFullscreen = document.getElementById("winnerFullscreen");
const winnerFullscreenName = document.getElementById("winnerFullscreenName");
const winnerFullscreenPrize = document.getElementById("winnerFullscreenPrize");

const wantAutoFullscreen = new URLSearchParams(window.location.search).get("fullscreen") === "1";
const isEmbed = new URLSearchParams(window.location.search).get("embed") === "1";
let revealTimerIds = [];
let winnersBoard = { current: [] };

function isViewerFullscreen() {
  return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
}

function syncFullscreenUi() {
  document.body.classList.toggle("is-fullscreen", isViewerFullscreen());
}

async function requestViewerFullscreen() {
  const target = document.documentElement;

  try {
    if (target.requestFullscreen) {
      await target.requestFullscreen();
    } else if (target.webkitRequestFullscreen) {
      target.webkitRequestFullscreen();
    }
  } catch (error) {
    console.warn("Plein écran non disponible:", error);
  }

  syncFullscreenUi();
}

if (wantAutoFullscreen) {
  document.body.classList.add("wheel-auto-fullscreen");
  window.addEventListener("load", () => {
    requestViewerFullscreen();
  });
}

if (isEmbed) {
  document.body.classList.add("wheel-embed");
}

document.addEventListener("fullscreenchange", syncFullscreenUi);
document.addEventListener("webkitfullscreenchange", syncFullscreenUi);
syncFullscreenUi();

function clearRevealTimers() {
  revealTimerIds.forEach((timerId) => clearTimeout(timerId));
  revealTimerIds = [];
}

function hideWinnerFullscreen() {
  winnerFullscreen.classList.remove("is-visible");
  winnerFullscreen.hidden = true;
  winnerFullscreen.setAttribute("aria-hidden", "true");
  document.body.classList.remove("wheel-winner-reveal-active");
}

function showWinnerFullscreen(label, prize) {
  clearRevealTimers();
  hideWinnerFullscreen();

  winnerFullscreenName.textContent = label || "—";

  if (prize) {
    winnerFullscreenPrize.textContent = prize;
    winnerFullscreenPrize.hidden = false;
  } else {
    winnerFullscreenPrize.textContent = "";
    winnerFullscreenPrize.hidden = true;
  }

  winnerFullscreen.hidden = false;
  winnerFullscreen.setAttribute("aria-hidden", "false");
  document.body.classList.add("wheel-winner-reveal-active");
  winnerFullscreen.classList.add("is-visible");
}

function prizeForLabel(label) {
  const list = Array.isArray(winnersBoard.current) ? winnersBoard.current : [];
  for (let index = list.length - 1; index >= 0; index -= 1) {
    if (list[index]?.label === label) return list[index].prize || "";
  }
  return "";
}

function showWinnerFromResult(label, prize) {
  if (!label || label === "…" || label === "—") return;
  showWinnerFullscreen(label, prize || prizeForLabel(label));
}

const wheel = WheelCore.createWheelController({
  canvas: document.getElementById("wheelCanvas"),
  lightsEl: document.getElementById("wheelLights")
});

function updatePrizeBanner(info) {
  if (!info || !info.hasPrizeQueue) {
    wheelPrizeValue.textContent = "—";
    wheelPrizeRemaining.textContent = "";
    wheelPrizeBanner.classList.remove("is-done");
    return;
  }

  if (info.allPrizesDone || !info.currentPrize) {
    wheelPrizeValue.textContent = "Terminé";
    wheelPrizeRemaining.textContent = "0 restant";
    wheelPrizeBanner.classList.add("is-done");
    return;
  }

  wheelPrizeValue.textContent = info.currentPrize;
  const remaining = Number(info.prizeRemaining) || 0;
  wheelPrizeRemaining.textContent = remaining === 1
    ? "1 restant"
    : `${remaining} restants`;
  wheelPrizeBanner.classList.remove("is-done");
}

const wheelSocket = WheelSocket.createWheelSocket({
  joinEvent: "joinWheelViewer",
  wheel,
  emptyResultLabel: "",
  onResult(label) {
    showWinnerFromResult(label);
  },
  onWinnersUpdate(winners) {
    winnersBoard = winners || { current: [] };
    WheelWinners.renderWinnersList(winnersListEl, winners);
  },
  onMusicChange(enabled) {
    WheelSounds.setMusicEnabled(enabled);
  },
  onPrizeDrawUpdate: updatePrizeBanner,
  onWinnerReveal({ label, prize }) {
    showWinnerFromResult(label, prize);
  },
  onSegmentsApplied() {},
  onStatus() {},
  onSpinStateChange(isSpinning) {
    if (isSpinning) {
      clearRevealTimers();
      hideWinnerFullscreen();
    }
  },
  onSegmentTick() {
    WheelSounds.playTick();
  }
});

WheelSounds.setWinClaimHandler(() => {
  wheelSocket.claimWinTune();
});

WheelSounds.mountUnlockButton({
  label: "Activer le son",
  onUnlocked() {}
});

function onViewerPointerDown() {
  WheelSounds.unlock().then((ok) => {
    if (ok) {
      document.removeEventListener("pointerdown", onViewerPointerDown);
    }
  });

  if (wantAutoFullscreen && !isViewerFullscreen()) {
    requestViewerFullscreen();
  }
}

document.addEventListener("pointerdown", onViewerPointerDown);

document.addEventListener("keydown", (event) => {
  if (!wantAutoFullscreen || isViewerFullscreen()) return;
  if (event.key === "Enter" || event.key === " " || event.key === "f" || event.key === "F") {
    requestViewerFullscreen();
  }
});
</script>

</body>
</html>
