<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Famille en or — Écran</title>
<link rel="stylesheet" href="/feud.css">
</head>
<body class="feud-view">
<div id="stage"></div>
<button type="button" id="fs" class="viewer-fs">Plein écran</button>
<script src="/socket.io/socket.io.js"></script>
<script src="/feud-board.js"></script>
<script>
(function () {
  const stage = document.getElementById("stage");
  const board = FeudBoard.mount(stage);

  document.addEventListener("keydown", (event) => {
    if (event.key !== "0") return;
    event.preventDefault();
    socket.emit("feudSilence");
  });
  document.getElementById("fs").addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  const socket = io();
  socket.on("feudState", (state) => board.update(state));
  socket.emit("joinFeudViewer", (state) => board.update(state));
})();
</script>
</body>
</html>
