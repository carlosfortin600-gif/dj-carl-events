<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Famille en or — Écran</title>
<link rel="stylesheet" href="/feud.css?v=centre3">
</head>
<body class="feud-view">
<div id="stage"></div>
<button type="button" id="fs" class="viewer-fs">Plein écran</button>
<script src="/socket.io/socket.io.js"></script>
<script src="/feud-board.js"></script>
<script>
(function () {
  const stage = document.getElementById("stage");
  const board = FeudBoard.mount(stage);
  const socket = io();

  document.addEventListener("keydown", (event) => {
    if (event.key !== "0") return;
    event.preventDefault();
    socket.emit("feudSilence");
  });
  const fs = document.getElementById("fs");
  function fullscreenOn() {
    return document.fullscreenElement || document.webkitFullscreenElement;
  }
  function syncFs() {
    fs.textContent = fullscreenOn() ? "Quitter" : "Plein écran";
  }
  fs.addEventListener("click", () => {
    if (!fullscreenOn()) {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
      return;
    }
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  });
  document.addEventListener("fullscreenchange", syncFs);
  document.addEventListener("webkitfullscreenchange", syncFs);

  socket.on("feudState", (state) => board.update(state));
  socket.emit("joinFeudViewer", (state) => board.update(state));
})();
</script>
</body>
</html>
