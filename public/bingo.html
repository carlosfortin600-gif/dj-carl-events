<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Carl — Bingo</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(circle at top, #1f2937, #050505 65%);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.page {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  gap: 22px;
}

h1 {
  margin: 0;
  font-size: clamp(32px, 5vw, 48px);
  color: #ff2d95;
  text-align: center;
}

.lead {
  margin: 0;
  max-width: 560px;
  color: #ccc;
  line-height: 1.5;
  text-align: center;
}

.styles {
  width: min(640px, 100%);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.style {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 18px 18px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-top: 4px solid #ff2d95;
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
}

.style strong {
  display: block;
  font-size: 22px;
}

.style span {
  color: #ccc;
  font-size: 14px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.actions a {
  display: inline-block;
  padding: 12px 16px;
  border-radius: 12px;
  font-weight: 800;
  text-decoration: none;
}

.actions a.host {
  background: linear-gradient(180deg, #2fd37a, #19a95d);
  color: #04140c;
}

.actions a.viewer {
  background: linear-gradient(180deg, #3b82f6, #1d4ed8);
  color: white;
}

.empty {
  margin: 0;
  color: #ccc;
  text-align: center;
}

.back {
  display: inline-block;
  padding: 12px 20px;
  border-radius: 12px;
  background: #00d4ff;
  color: #001018;
  font-weight: 700;
  text-decoration: none;
}
</style>
</head>
<body>

<div class="page">
  <h1>Bingo</h1>
  <p class="lead">Choisis un style. Le JSON du dossier s'ouvre dans le vérificateur et dans le viewer.</p>
  <div class="styles" id="styles">
    <p class="empty">Chargement des styles…</p>
  </div>
  <a
    class="back"
    href="/"
    data-home-confirm
    data-home-confirm-message="Retourner à l'accueil ?"
  >Retour à l'accueil</a>
</div>

<script src="/home-confirm.js"></script>
<script>
(function () {
  const box = document.getElementById("styles");

  function esc(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/"/g, "&quot;");
  }

  fetch("/api/bingo/styles")
    .then((res) => res.json())
    .then((styles) => {
      if (!Array.isArray(styles) || !styles.length) {
        box.innerHTML = '<p class="empty">Aucun pack JSON dans le dossier Bingo musical.</p>';
        return;
      }

      box.innerHTML = styles.map((style) => {
        const id = encodeURIComponent(style.id);
        return (
          '<article class="style">' +
            '<div><strong>' + esc(style.name) + '</strong>' +
            '<span>' + esc(style.cards) + ' cartes · ' + esc(style.songs) + ' chansons</span></div>' +
            '<div class="actions">' +
              '<a class="host" href="/bingo/verificateur?pack=' + id + '">Vérificateur</a>' +
              '<a class="viewer" href="/bingo/viewer?pack=' + id + '" target="djCarlBingoViewer">Viewer</a>' +
            '</div>' +
          '</article>'
        );
      }).join("");
    })
    .catch(() => {
      box.innerHTML = '<p class="empty">Impossible de lire les styles.</p>';
    });
})();
</script>
</body>
</html>
